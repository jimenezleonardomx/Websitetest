name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # `if:` cannot reference `secrets` directly (GitHub Actions restriction) --
    # promoting to job-level env is the documented workaround, checked below
    # via the `env` context instead.
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      REPO_PATH: ${{ secrets.REPO_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format, lint, typecheck
        run: npm run check

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # `deploy` is generated content only -- see docs/adr/0002 and
      # docs/deploy.md. It is always force-pushed; never edit it by hand,
      # never merge it into main.
      - name: Push static export to the deploy branch
        run: |
          set -e
          rm -rf /tmp/deploy-out
          mkdir -p /tmp/deploy-out
          cp -r out/. /tmp/deploy-out/
          cd /tmp/deploy-out
          echo "* -text" > .gitattributes
          git init -q
          git checkout -q -b deploy
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "deploy: static export from ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin deploy

      # cPanel's Git checkout at $REPO_PATH IS public_html/tabaco directly (no
      # separate rsync target) -- so pulling the deploy branch there is the
      # entire deploy. Verified this exact directory layout by hand before
      # automating it (2026-09-03).
      - name: Pull deploy branch onto the server over SSH
        if: ${{ env.SSH_HOST != '' }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" bash -s <<EOF
              set -e
              cd "$REPO_PATH"
              git fetch origin deploy
              git reset --hard origin/deploy
              echo "Deployed commit: \$(git rev-parse HEAD)"
              echo "Expected commit: ${{ github.sha }} (source commit; deploy branch commit will differ, this just confirms the pull ran)"
          EOF

      - name: SSH auto-deploy not configured
        if: ${{ env.SSH_HOST == '' }}
        run: |
          echo "::warning::Static export pushed to the deploy branch, but SSH_HOST is not set, so the server was not updated. Click Deploy Repository in cPanel's Git Version Control panel manually, or see docs/deploy.md to finish wiring this up."
